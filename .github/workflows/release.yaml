name: release
on:
  push:
    tags:
      - "v[0-9]+.*"
jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres, mysql]
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: haras
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: |
          nix build --show-trace ".#unwrapped-${{ matrix.backend }}"
          mkdir -p release
          cp -L result/bin/mcp-plan "release/mcp-plan-${{ matrix.arch }}-${{ matrix.backend }}"
          tar -czf "mcp-plan-${{ matrix.arch }}-${{ matrix.backend }}.tar.gz" \
            -C release "mcp-plan-${{ matrix.arch }}-${{ matrix.backend }}"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" mcp-plan-${{ matrix.arch }}-${{ matrix.backend }}.tar.gz --clobber
